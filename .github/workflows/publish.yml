name: Publish VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to package and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: vscode-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      VSIX_PATH: array-scope-${{ github.event.release.tag_name || inputs.release_tag }}.vsix

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_TAG#v}"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
          published_release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')"
          if [[ "$published_release" != "true" ]]; then
            echo "Release $RELEASE_TAG must already be published and must not be a prerelease." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Normalize icon for Marketplace
        run: |
          python -m pip install Pillow==12.3.0
          python - <<'PYTHON'
          from PIL import Image
          with Image.open("images/icon.png") as icon:
              if max(icon.size) > 1024:
                  original = icon.size
                  icon.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
                  icon.save("images/icon.png", optimize=True)
                  print(f"Resized Marketplace icon from {original} to {icon.size}")
          PYTHON

      - name: Test, build, and package
        run: npm run package -- --out "$VSIX_PATH"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath "$VSIX_PATH" --skip-duplicate

      - name: Attach VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$VSIX_PATH" --clobber
